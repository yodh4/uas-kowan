<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Tutorial</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>Kalkulator Lingkaran (Passkey)</h1>
    <div id="message"></div>

    <div id="auth-section" class="input-group">
        <input type="text" id="username" placeholder="Masukkan username">
        <button id="registerButton">Register</button>
        <button id="loginButton">Login</button>
    </div>

    <div id="calculator-section" class="input-group" style="display:none; margin-top:20px;">
        <h3>Hitung Luas & Keliling</h3>
        <input type="number" id="radius" placeholder="Masukkan Jari-jari (r)">
        <button id="calculateButton">Hitung</button>
        
        <div id="result" style="margin-top:15px; text-align:left;"></div>
        <button onclick="location.reload()" style="background-color:#6c757d; margin-top:10px;">Logout / Reset</button>
    </div>
</div>

<script src="https://unpkg.com/@simplewebauthn/browser@^8.0.0/dist/bundle/index.es5.umd.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
