# --- Database MySQL ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "my-secret-pw"
        - name: MYSQL_DATABASE
          value: "webauthn_db"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
# --- Aplikasi Passkey + Kalkulator ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passkey-app
  template:
    metadata:
      labels:
        app: passkey-app
    spec:
      containers:
      - name: passkey-app
        image: passkey-app:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 30000 
        env:
        - name: DB_HOST
          value: "db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "my-secret-pw"
        - name: DB_NAME
          value: "webauthn_db"
        - name: SESSION_SECRET
          value: "rahasia-super"
        
        - name: RP_ID
          value: "semibourgeois-auditive-jamaal.ngrok-free.dev"
        
        - name: PORT
          value: "30000"
---
apiVersion: v1
kind: Service
metadata:
  name: passkey-service
spec:
  type: NodePort
  selector:
    app: passkey-app
  ports:
    - port: 30000
      targetPort: 30000 
      nodePort: 30000